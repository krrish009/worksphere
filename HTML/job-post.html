<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employer Portal - WorkSphere</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/responsive.css">
</head>
<body>

    <nav>
        <div class="logo">WorkSphere</div>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="jobs.html">Browse Jobs</a></li>
            <li><a href="tracker.html">My Tracker</a></li>
            <li><a href="job-post.html" class="active">Employer Portal</a></li>
        </ul>
    </nav>

    <div class="container" style="max-width: 700px; flex: 1;">
        <h2>Post a New Position</h2>
        <p style="color: var(--text-light); margin-bottom: 25px;">Broadcast your opportunity to top-tier global talent.</p>
        
        <form onsubmit="handleJobPost(event)">
            <div class="form-group">
                <label>Job Title</label>
                <input type="text" id="post-title" class="form-control" required placeholder="e.g. Frontend Developer">
            </div>
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" id="post-company" class="form-control" required placeholder="e.g. TechCorp">
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" id="post-location" class="form-control" required placeholder="e.g. Remote">
            </div>
            <div class="form-group">
                <label>Salary Range</label>
                <input type="text" id="post-salary" class="form-control" required placeholder="e.g. $95k - $120k">
            </div>
            <div class="form-group">
                <label>Employment Type</label>
                <select id="post-type" class="form-control">
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Contract">Contract</option>
                    <option value="Internship">Internship</option>
                </select>
            </div>
            <div class="form-group">
                <label>Job Description</label>
                <textarea id="post-desc" class="form-control" rows="4" required placeholder="Describe role requirements..."></textarea>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Publish Job Opening</button>
        </form>
    </div>

    <script src="../JAVASCRIPT/job-post.js"></script>
</body>
</html>
